# Engineering checklist, not an official HA rating. Comments identify evidence.
rules:
  action-setup:
    status: exempt
    comment: Uses standard number and button actions; registers no custom services.
  appropriate-polling:
    status: done
    comment: One map read every five seconds; configurable 2–300 seconds. tests/test_integration.py.
  brands:
    status: todo
    comment: Add approved manufacturer artwork and submit to HA brands when publishing; no artwork rights were supplied.
  common-modules:
    status: done
    comment: Independent mygrid-modbus package owns the protocol; const, coordinator and entity modules own HA lifecycle.
  config-flow:
    status: done
    comment: UI host/port setup with an actual map probe. tests/test_config_flow.py.
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py covers success, duplicate, failure, options and reconfiguration paths.
  dependency-transparency:
    status: done
    comment: README and manifest disclose mygrid-modbus==0.1.0, the shared modbus-connection transport and publication prerequisite.
  docs-actions:
    status: done
    comment: README explains number.set_value and button.press, confirmation and uncertainty.
  docs-conditions:
    status: exempt
    comment: No custom automation conditions.
  docs-high-level-description:
    status: done
    comment: README introduction and protocol scope.
  docs-installation-instructions:
    status: done
    comment: README provides immediately usable manual installation and post-publication HACS instructions.
  docs-removal-instructions:
    status: done
    comment: README explains entry removal, uninstalling and retained battery setpoints.
  docs-triggers:
    status: exempt
    comment: No custom automation triggers.
  entity-event-setup:
    status: exempt
    comment: CoordinatorEntity manages subscriptions; entities register no additional event listeners.
  entity-unique-id:
    status: done
    comment: Entry ID plus semantic entity key; reconfiguration preserves history. tests/test_config_flow.py.
  has-entity-name:
    status: done
    comment: MyGridEntity sets has_entity_name for all platforms.
  runtime-data:
    status: done
    comment: Typed MyGridConfigEntry stores coordinator in runtime_data.
  test-before-configure:
    status: done
    comment: Config flow probes a full supported map before creation.
  test-before-setup:
    status: done
    comment: Setup probes once before forwarding platforms. tests/test_integration.py.
  unique-config-entry:
    status: done
    comment: Normalized endpoint duplicate checks before/after probe; hardware identity unavailable in protocol.
  action-exceptions:
    status: done
    comment: Standard entity actions raise translated ServiceValidationError or HomeAssistantError.
  config-entry-unloading:
    status: done
    comment: Platform unload removes listeners and releases the managed unit; other consumers keep their connection. tests/test_integration.py.
  docs-configuration-parameters:
    status: done
    comment: README explains polling interval, bounds and default.
  docs-installation-parameters:
    status: done
    comment: README documents host, port and fixed unit ID.
  entity-unavailable:
    status: done
    comment: Coordinator marks disconnected entities unavailable; status-2 fields become unknown.
  integration-owner:
    status: todo
    comment: Connected account @tjorim is listed in codeowners; confirm ongoing maintainership before publication.
  log-when-unavailable:
    status: done
    comment: Coordinator logs failure and recovery transitions. tests/test_integration.py.
  parallel-updates:
    status: done
    comment: Platforms declare PARALLEL_UPDATES; client/coordinator serialize operations and the HA Modbus manager shares and serializes the physical link.
  reauthentication-flow:
    status: exempt
    comment: Documented Modbus TCP endpoint has no authentication.
  test-coverage:
    status: done
    comment: CI requires at least 95 percent branch-aware coverage of the integration.
  devices:
    status: done
    comment: One device per configured endpoint, without fabricated serial or follower identities.
  diagnostics:
    status: done
    comment: Allowlisted snapshots omit endpoint and entry identities. tests/test_integration.py.
  discovery:
    status: exempt
    comment: Supplied protocol defines no discoverable service or hardware identity.
  discovery-update-info:
    status: exempt
    comment: No discovery transport; address changes use reconfiguration.
  docs-data-update:
    status: done
    comment: README documents polling, command reads, staleness and reconnect behavior.
  docs-examples:
    status: done
    comment: README includes scheduled charge and explicit idle automations.
  docs-known-limitations:
    status: done
    comment: README lists one client, competing controllers, no watchdog guarantee and cluster scope limits.
  docs-supported-devices:
    status: done
    comment: README explicitly limits support to ModuleTwo map 2.
  docs-supported-functions:
    status: done
    comment: README entity table and docs/protocol.md register summary.
  docs-troubleshooting:
    status: done
    comment: README troubleshooting table, uncertainty handling and diagnostics.
  docs-use-cases:
    status: done
    comment: README covers battery monitoring, Energy dashboard, fault alerts and explicit automation.
  dynamic-devices:
    status: exempt
    comment: Protocol has no follower enumeration; a configured endpoint always represents one device.
  entity-category:
    status: done
    comment: Faults, map version and restart are diagnostics; operational power control is a primary entity.
  entity-device-class:
    status: done
    comment: Battery, power, energy, energy storage, enum, problem and restart classes are assigned.
  entity-disabled-by-default:
    status: done
    comment: Per-fault indicators, raw flags, map version and restart are opt-in.
  entity-translations:
    status: done
    comment: All names and enum states have English translation keys and a matching strings.json.
  exception-translations:
    status: done
    comment: Communication, map and command errors have translated exception messages.
  icon-translations:
    status: done
    comment: Standard device-class icons plus icons.json for unclassified diagnostic sensors.
  reconfiguration-flow:
    status: done
    comment: Address reconfiguration preserves identity and restores prior settings on probe failure.
  repair-issues:
    status: exempt
    comment: No separately repairable conditions; actionable setup and communication errors use standard HA flows.
  stale-devices:
    status: exempt
    comment: No dynamic subdevices; entry removal removes the single configured device through HA.
  async-dependency:
    status: done
    comment: Independent mygrid-modbus library accepts ModbusUnit; HA owns the async shared connection. Both backend suites verify no write retries.
  inject-websession:
    status: exempt
    comment: Modbus TCP has no HTTP websession.
  strict-typing:
    status: done
    comment: All integration modules pass strict mypy; CI runs the same check.
