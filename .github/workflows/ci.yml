name: Validate core contribution
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  overlay-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-mygrid-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ha-mygrid-core
          persist-credentials: false
      # The libraries are development path sources next to this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tjorim/mygrid-modbus
          ref: 81e26e35a3d10762933bae146364780889d6a464
          path: mygrid-modbus
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tjorim/mygrid-voltbridge
          ref: a9075fc5e25a3a8055301e3f75a5dd0a3437d84c
          path: mygrid-voltbridge
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/validate_metadata.py
