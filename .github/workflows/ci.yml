name: Validate core contribution
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  overlay-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-mygrid-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ha-mygrid-core
          persist-credentials: false
      # The libraries are development path sources next to this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tjorim/python-mygrid-modbus
          ref: 3316c0aa820b5ad71aff79600df3dcae2a452b9d
          path: python-mygrid-modbus
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tjorim/python-mygrid-voltbridge
          ref: d03ba5115ef7a5de79a7a8427b3ad906923bb198
          path: python-mygrid-voltbridge
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/validate_metadata.py
