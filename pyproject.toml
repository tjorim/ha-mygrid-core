[project]
name = "ha-mygrid-core"
version = "0.1.0"
description = "MyGrid integration (ModuleTwo battery, VoltBridge P1 meter) for Home Assistant core"
requires-python = ">=3.14.2"
license = "MIT"
# Unpinned here: the sibling checkouts below are versioned by git tags (hatch-vcs).
# The release pins live in the HA manifest, which installs from PyPI.
dependencies = ["mygrid-modbus", "mygrid-voltbridge"]

[dependency-groups]
dev = [
  # Match the current stable Core shared Modbus transport during integration tests.
  "modbus-connection[tmodbus]==4.12.4",
  "tmodbus==0.6.2",
  "pymodbus==3.13.1",
  "pytest-homeassistant-custom-component==0.13.373",
  "ruff==0.17.2",
  "mypy==2.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# Development-only sources; the HA manifest installs the versioned PyPI releases.
mygrid-modbus = { path = "../python-mygrid-modbus" }
mygrid-voltbridge = { path = "../python-mygrid-voltbridge" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/components/mygrid"]
pythonpath = ["."]
addopts = "-m 'not live' --strict-markers --cov=homeassistant.components.mygrid --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
filterwarnings = ["error"]
markers = [
  "simulator: exercises the real TCP protocol against a local simulator",
  "live: runs the real integration against a real device (set VOLTBRIDGE_HOST); excluded from ordinary runs",
]

[tool.coverage.run]
branch = true
source = ["homeassistant.components.mygrid"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # typing.Any is used for config-entry plumbing
  "COM812",  # incompatible with the formatter
  "CPY001",
  "D203",
  "D213",
  "E501",
  "ISC001",  # incompatible with the formatter
  "TC001",
  "TC002",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
# The offline suite is not annotated or documented line by line.
"tests/**" = [
  "ANN",
  "ARG",
  "D",
  "INP001",
  "PLC0415",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "PT011",
  "S101",
  "SLF001",
]
"scripts/**" = ["INP001", "S101", "S603", "S607", "T201"]
"conftest.py" = ["D", "INP001"]
# Home Assistant fixes the signatures of platform setup, flow steps and options.
"homeassistant/**" = ["ARG"]
"scripts/hacs_templates/**" = ["ARG", "INP001"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
files = ["homeassistant/components/mygrid"]
